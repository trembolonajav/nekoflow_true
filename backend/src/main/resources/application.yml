server:
  port: 8080
  error:
    include-message: always
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

nekoflow:
  public-url: ${NEKOFLOW_PUBLIC_URL:http://localhost:3000}
  bootstrap-admin:
    enabled: ${NEKOFLOW_BOOTSTRAP_ADMIN:false}
    username: ${NEKOFLOW_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${NEKOFLOW_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${NEKOFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${NEKOFLOW_DEMO:true}
    password: ${NEKOFLOW_DEMO_PASSWORD:nekoflow2026}

spring:
  application:
    name: nekoflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nekoflow}
    username: ${DB_USER:nekoflow}
    password: ${DB_PASSWORD:nekoflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 7d
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health
