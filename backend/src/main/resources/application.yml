server:
  port: ${SERVER_PORT:9090}
  error:
    include-message: always
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

nekoflow:
  sushi-animes:
    enabled: ${SUSHI_ANIMES_ENABLED:true}
    origin: ${SUSHI_ANIMES_ORIGIN:https://sushianimes.com.br}
    cdn-hosts: ${SUSHI_ANIMES_CDN_HOSTS:cdn-s01.pixel-sus-4k-image.com,cdn-sv01.maximaimg.online}
    request-timeout-seconds: ${SUSHI_ANIMES_REQUEST_TIMEOUT_SECONDS:25}
  public-url: ${NEKOFLOW_PUBLIC_URL:http://localhost:9080}
  bootstrap-admin:
    enabled: ${NEKOFLOW_BOOTSTRAP_ADMIN:false}
    username: ${NEKOFLOW_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${NEKOFLOW_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${NEKOFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${NEKOFLOW_DEMO:true}
    password: ${NEKOFLOW_DEMO_PASSWORD:123456}
  media:
    # Arquivos de páginas importadas (volume compartilhado com o Nginx, que os entrega).
    storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
    # Segredo do secure_link do Nginx; troque em produção (mesmo valor nos dois serviços).
    signing-secret: ${MEDIA_SIGNING_SECRET:dev-only-nekoflow-media-secret}
    url-ttl-seconds: ${MEDIA_URL_TTL_SECONDS:3600}
    public-prefix: /media
  anilist:
    sync-on-boot: ${ANILIST_SYNC_ON_BOOT:true}
  hianime:
    enabled: ${HIANIME_SYNC_ENABLED:true}
    origin: ${HIANIME_ORIGIN:https://hianime.at}
    sync-interval-ms: ${HIANIME_SYNC_INTERVAL_MS:900000}
    initial-delay-ms: ${HIANIME_SYNC_INITIAL_DELAY_MS:90000}
    recent-pages: ${HIANIME_SYNC_RECENT_PAGES:2}
    request-timeout-seconds: ${HIANIME_API_TIMEOUT_SECONDS:20}
  mangalivre:
    enabled: ${MANGALIVRE_ENABLED:true}
    origin: ${MANGALIVRE_ORIGIN:https://mangalivre.blog}
    request-timeout-seconds: ${MANGALIVRE_API_TIMEOUT_SECONDS:20}
    cache-ttl-seconds: ${MANGALIVRE_CACHE_TTL_SECONDS:120}
  # Adaptador separado: todo o conteúdo deste provedor está em inglês.
  weebcentral-en:
    enabled: ${WEEBCENTRAL_EN_ENABLED:true}
    origin: ${WEEBCENTRAL_EN_ORIGIN:https://weebcentral.com}
    request-timeout-seconds: ${WEEBCENTRAL_EN_API_TIMEOUT_SECONDS:20}
    cache-ttl-seconds: ${WEEBCENTRAL_EN_CACHE_TTL_SECONDS:120}
  # APIs normalizadas de leitura. TiaManhwa e Comix são integrações não oficiais;
  # ManhwaBuddy está identificado como parceria autorizada no inventário administrativo.
  reading-providers:
    request-timeout-seconds: ${READING_PROVIDERS_TIMEOUT_SECONDS:20}
    cache-ttl-seconds: ${READING_PROVIDERS_CACHE_TTL_SECONDS:120}
    tiamanhwa-origin: ${TIAMANHWA_ORIGIN:https://tiamanhwa.com}
    comix-origin: ${COMIX_ORIGIN:https://comix.to}
    manhwabuddy-origin: ${MANHWABUDDY_ORIGIN:https://manhwabuddy.com}
    tiamanhwa-fetcher-url: ${TIAMANHWA_FETCHER_URL:}
    tiamanhwa-fetcher-secret: ${TIA_FETCHER_SECRET:}
    comix-fetcher-url: ${COMIX_FETCHER_URL:}
    comix-fetcher-secret: ${COMIX_FETCHER_SECRET:}

spring:
  application:
    name: nekoflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9432/nekoflow}
    username: ${DB_USER:nekoflow}
    password: ${DB_PASSWORD:nekoflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Permite aplicar migrações de correção numeradas abaixo da versão atual
    # (ex.: V5_1, que conserta instalações novas sem alterar a V6 já aplicada).
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 450MB
  session:
    jdbc:
      initialize-schema: never
    timeout: 7d
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health
