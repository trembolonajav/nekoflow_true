server:
  port: 8080
  error:
    include-message: always
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax

nekoflow:
  demo:
    enabled: ${NEKOFLOW_DEMO:true}
    password: ${NEKOFLOW_DEMO_PASSWORD:nekoflow2026}

spring:
  application:
    name: nekoflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nekoflow}
    username: ${DB_USER:nekoflow}
    password: ${DB_PASSWORD:nekoflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
