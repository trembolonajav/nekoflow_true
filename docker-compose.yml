services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-9026}:1025"
      - "${MAILPIT_UI_PORT:-9025}:8025"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nekoflow}
      POSTGRES_USER: ${DB_USER:-nekoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nekoflow}
    ports:
      - "${DB_PORT:-9432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nekoflow} -d ${DB_NAME:-nekoflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nekoflow}
      DB_USER: ${DB_USER:-nekoflow}
      DB_PASSWORD: ${DB_PASSWORD:-nekoflow}
      NEKOFLOW_DEMO: ${NEKOFLOW_DEMO:-true}
      NEKOFLOW_DEMO_PASSWORD: ${NEKOFLOW_DEMO_PASSWORD:-nekoflow2026}
      NEKOFLOW_PUBLIC_URL: ${NEKOFLOW_PUBLIC_URL:-http://localhost:9080}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MEDIA_STORAGE_DIR: /data/media
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-dev-only-nekoflow-media-secret}
    volumes:
      - media:/data/media
    ports:
      - "${BACKEND_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-dev-only-nekoflow-media-secret}
    volumes:
      - media:/var/lib/nekoflow/media:ro
    ports:
      - "${FRONTEND_PORT:-9080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
